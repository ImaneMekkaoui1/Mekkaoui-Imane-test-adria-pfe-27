server:
  port: 8084

spring:
  application:
    name: chatbot-service

chatbot:
  account-service-url: http://localhost:8081
  transaction-service-url: http://localhost:8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

