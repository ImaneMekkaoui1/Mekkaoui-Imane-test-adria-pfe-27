name: Banking Platform CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Unit/Integration Tests
        run: |
          mvn clean test --batch-mode

      - name: Package Applications
        run: |
          mvn package -DskipTests --batch-mode

      - name: Log in to Docker Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Images
        if: github.ref == 'refs/heads/main'
        run: |
          SERVICES=("discovery-service" "config-service" "gateway-service" "account-service" "transaction-service" "audit-service" "chatbot-service")
          for SERVICE in "${SERVICES[@]}"; do
            IMAGE_TAG="ghcr.io/${{ github.repository }}/${SERVICE}:${{ github.sha }}"
            docker build -t $IMAGE_TAG ./$SERVICE
            docker push $IMAGE_TAG
          done

      - name: Deploy Step (Staging / Production)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Déploiement des microservices conteneurisés..."
          # docker compose pull && docker compose up -d

