<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%">
  <defs>
    <style>
      .code { font-family: 'SF Mono', Consolas, 'Courier New', monospace; font-size: 13px; }
      .field { fill: #2563eb; }
      .kw { fill: #7c3aed; font-weight: 600; }
      .str { fill: #047857; }
      .num { fill: #d97706; }
    </style>
  </defs>

  <rect width="1100" height="620" fill="#f8fafc" />
  <rect x="25" y="20" width="1050" height="580" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <rect x="25" y="20" width="1050" height="45" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="50" cy="42" r="6" fill="#ef4444"/>
  <circle cx="70" cy="42" r="6" fill="#f59e0b"/>
  <circle cx="90" cy="42" r="6" fill="#10b981"/>
  <text x="120" y="47" font-family="sans-serif" font-size="13" font-weight="700" fill="#e11d48">GraphiQL IDE - Account &amp; Transaction GraphQL Schema</text>
  <rect x="940" y="30" width="110" height="26" rx="4" fill="#e11d48"/>
  <text x="965" y="47" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Execute</text>

  <rect x="45" y="80" width="490" height="500" rx="6" fill="#fafafa" stroke="#e2e8f0"/>
  <text x="65" y="110" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748b">REQUETE GRAPHQL</text>

  <text x="65" y="145" class="code"><tspan class="kw">query</tspan> {</text>
  <text x="85" y="175" class="code"><tspan class="field">bankAccountById</tspan>(id: <tspan class="str">"a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"</tspan>) {</text>
  <text x="110" y="205" class="code"><tspan class="field">id</tspan></text>
  <text x="110" y="235" class="code"><tspan class="field">customerReference</tspan></text>
  <text x="110" y="265" class="code"><tspan class="field">status</tspan></text>
  <text x="110" y="295" class="code"><tspan class="field">currency</tspan></text>
  <text x="110" y="325" class="code"><tspan class="field">balance</tspan></text>
  <text x="85" y="355" class="code">}</text>
  <text x="85" y="395" class="code"><tspan class="field">allBankAccounts</tspan> {</text>
  <text x="110" y="425" class="code"><tspan class="field">customerReference</tspan></text>
  <text x="110" y="455" class="code"><tspan class="field">balance</tspan></text>
  <text x="85" y="485" class="code">}</text>
  <text x="65" y="515" class="code">}</text>

  <rect x="555" y="80" width="500" height="500" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="575" y="110" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748b">REPONSE JSON</text>

  <text x="575" y="145" class="code" fill="#64748b">{</text>
  <text x="595" y="175" class="code"><tspan class="kw">"data"</tspan>: {</text>
  <text x="615" y="205" class="code"><tspan class="kw">"bankAccountById"</tspan>: {</text>
  <text x="635" y="235" class="code">"id": <tspan class="str">"a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"</tspan>,</text>
  <text x="635" y="265" class="code">"customerReference": <tspan class="str">"CUST-ADRIA-001"</tspan>,</text>
  <text x="635" y="295" class="code">"status": <tspan class="str">"ACTIVE"</tspan>,</text>
  <text x="635" y="325" class="code">"currency": <tspan class="str">"EUR"</tspan>,</text>
  <text x="635" y="355" class="code">"balance": <tspan class="num">2500.0</tspan></text>
  <text x="615" y="385" class="code">},</text>
  <text x="615" y="415" class="code"><tspan class="kw">"allBankAccounts"</tspan>: [</text>
  <text x="635" y="445" class="code">{ "customerReference": <tspan class="str">"CUST-ADRIA-001"</tspan>, "balance": <tspan class="num">2500.0</tspan> },</text>
  <text x="635" y="475" class="code">{ "customerReference": <tspan class="str">"CUST-ADRIA-002"</tspan>, "balance": <tspan class="num">1200.0</tspan> }</text>
  <text x="615" y="505" class="code">]</text>
  <text x="595" y="535" class="code">}</text>
  <text x="575" y="565" class="code" fill="#64748b">}</text>
</svg>