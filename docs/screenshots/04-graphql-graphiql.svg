<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <!-- Window frame -->
  <rect width="1000" height="520" rx="12" fill="#181e29" stroke="#334155" stroke-width="1.5"/>
  <rect width="1000" height="42" rx="12" fill="#111827"/>
  <rect y="30" width="1000" height="12" fill="#111827"/>
  <circle cx="20" cy="21" r="5" fill="#ef4444"/>
  <circle cx="36" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="21" r="5" fill="#10b981"/>
  <text x="500" y="25" fill="#e10098" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⚡ GraphiQL Explorer — Interface Interactive GraphQL (:8081 / :8082)</text>

  <!-- Query Pane (Left) -->
  <rect x="20" y="55" width="460" height="445" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <rect x="20" y="55" width="460" height="32" rx="8" fill="#1e293b"/>
  <rect x="20" y="75" width="460" height="12" fill="#1e293b"/>
  <text x="35" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">QUERY EDITOR</text>
  <rect x="420" y="60" width="50" height="22" rx="4" fill="#e10098"/>
  <text x="445" y="75" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">▶ RUN</text>

  <text x="35" y="110" fill="#a78bfa" font-family="monospace" font-size="12">query</text>
  <text x="80" y="110" fill="#38bdf8" font-family="monospace" font-size="12">GetAllAccountsWithDetails {</text>
  <text x="55" y="130" fill="#ec4899" font-family="monospace" font-size="12">  allAccounts {</text>
  <text x="75" y="150" fill="#38bdf8" font-family="monospace" font-size="12">    id</text>
  <text x="75" y="170" fill="#38bdf8" font-family="monospace" font-size="12">    customerReference</text>
  <text x="75" y="190" fill="#38bdf8" font-family="monospace" font-size="12">    currency</text>
  <text x="75" y="210" fill="#38bdf8" font-family="monospace" font-size="12">    balance</text>
  <text x="75" y="230" fill="#38bdf8" font-family="monospace" font-size="12">    status</text>
  <text x="55" y="250" fill="#ec4899" font-family="monospace" font-size="12">  }</text>
  <text x="35" y="270" fill="#a78bfa" font-family="monospace" font-size="12">}</text>

  <line x1="35" y1="290" x2="465" y2="290" stroke="#334155" stroke-dasharray="3"/>
  <text x="35" y="315" fill="#a78bfa" font-family="monospace" font-size="12">mutation</text>
  <text x="95" y="315" fill="#38bdf8" font-family="monospace" font-size="12">CreateNewAccount {</text>
  <text x="55" y="335" fill="#ec4899" font-family="monospace" font-size="12">  createAccount(input: {</text>
  <text x="75" y="355" fill="#94a3b8" font-family="monospace" font-size="12">    customerReference: <tspan fill="#34d399">"CUST-1005"</tspan>,</text>
  <text x="75" y="375" fill="#94a3b8" font-family="monospace" font-size="12">    currency: <tspan fill="#34d399">"EUR"</tspan>,</text>
  <text x="75" y="395" fill="#94a3b8" font-family="monospace" font-size="12">    initialBalance: <tspan fill="#f59e0b">1800.0</tspan></text>
  <text x="55" y="415" fill="#ec4899" font-family="monospace" font-size="12">  }) {</text>
  <text x="75" y="435" fill="#38bdf8" font-family="monospace" font-size="12">    id</text>
  <text x="75" y="455" fill="#38bdf8" font-family="monospace" font-size="12">    balance</text>
  <text x="75" y="475" fill="#38bdf8" font-family="monospace" font-size="12">    status</text>
  <text x="55" y="490" fill="#ec4899" font-family="monospace" font-size="12">  }</text>

  <!-- Response Pane (Right) -->
  <rect x="500" y="55" width="480" height="445" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <rect x="500" y="55" width="480" height="32" rx="8" fill="#1e293b"/>
  <rect x="500" y="75" width="480" height="12" fill="#1e293b"/>
  <text x="515" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">RESPONSE (JSON)</text>
  <text x="920" y="75" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">200 OK</text>

  <text x="515" y="110" fill="#f8fafc" font-family="monospace" font-size="12">{</text>
  <text x="530" y="130" fill="#38bdf8" font-family="monospace" font-size="12">  "data": {</text>
  <text x="545" y="150" fill="#ec4899" font-family="monospace" font-size="12">    "allAccounts": [</text>
  <text x="560" y="170" fill="#f8fafc" font-family="monospace" font-size="12">      {</text>
  <text x="575" y="190" fill="#94a3b8" font-family="monospace" font-size="12">        "id": <tspan fill="#a78bfa">"11111111-1111-1111-1111-111111111111"</tspan>,</text>
  <text x="575" y="210" fill="#94a3b8" font-family="monospace" font-size="12">        "customerReference": <tspan fill="#34d399">"CUST-1001"</tspan>,</text>
  <text x="575" y="230" fill="#94a3b8" font-family="monospace" font-size="12">        "currency": <tspan fill="#34d399">"EUR"</tspan>,</text>
  <text x="575" y="250" fill="#94a3b8" font-family="monospace" font-size="12">        "balance": <tspan fill="#f59e0b">5000.0</tspan>,</text>
  <text x="575" y="270" fill="#94a3b8" font-family="monospace" font-size="12">        "status": <tspan fill="#34d399">"ACTIVE"</tspan></text>
  <text x="560" y="290" fill="#f8fafc" font-family="monospace" font-size="12">      },</text>
  <text x="560" y="310" fill="#f8fafc" font-family="monospace" font-size="12">      {</text>
  <text x="575" y="330" fill="#94a3b8" font-family="monospace" font-size="12">        "id": <tspan fill="#a78bfa">"22222222-2222-2222-2222-222222222222"</tspan>,</text>
  <text x="575" y="350" fill="#94a3b8" font-family="monospace" font-size="12">        "customerReference": <tspan fill="#34d399">"CUST-1002"</tspan>,</text>
  <text x="575" y="370" fill="#94a3b8" font-family="monospace" font-size="12">        "currency": <tspan fill="#34d399">"EUR"</tspan>,</text>
  <text x="575" y="390" fill="#94a3b8" font-family="monospace" font-size="12">        "balance": <tspan fill="#f59e0b">1500.0</tspan>,</text>
  <text x="575" y="410" fill="#94a3b8" font-family="monospace" font-size="12">        "status": <tspan fill="#34d399">"ACTIVE"</tspan></text>
  <text x="560" y="430" fill="#f8fafc" font-family="monospace" font-size="12">      }</text>
  <text x="545" y="450" fill="#ec4899" font-family="monospace" font-size="12">    ]</text>
  <text x="530" y="470" fill="#38bdf8" font-family="monospace" font-size="12">  }</text>
  <text x="515" y="490" fill="#f8fafc" font-family="monospace" font-size="12">}</text>
</svg>

