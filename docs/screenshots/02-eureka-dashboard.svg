<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Browser window frame -->
  <rect width="1000" height="580" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect width="1000" height="42" rx="12" fill="#f1f5f9"/>
  <rect y="30" width="1000" height="12" fill="#f1f5f9"/>
  <circle cx="20" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="38" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5.5" fill="#10b981"/>
  
  <!-- Address bar -->
  <rect x="120" y="8" width="760" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="140" y="25" fill="#475569" font-family="-apple-system, sans-serif" font-size="12">🔒 http://localhost:8761 — Spring Eureka Dashboard (Discovery Service)</text>

  <!-- Eureka Header -->
  <rect y="42" width="1000" height="70" fill="#6db33f"/>
  <text x="40" y="85" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900">Spring Cloud Eureka</text>
  <text x="40" y="103" fill="#ecfdf5" font-family="sans-serif" font-size="12">System Status: UP | Environment: test | Current Time: Fri Oct 30 10:15:22 UTC 2026</text>

  <!-- General Info Cards -->
  <rect x="40" y="130" width="920" height="75" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
