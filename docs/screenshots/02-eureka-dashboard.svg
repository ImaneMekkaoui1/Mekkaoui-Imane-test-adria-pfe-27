  <text x="60" y="540" fill="#0284c7" font-family="monospace" font-size="13" font-weight="bold">CONFIG-SERVICE</text>
  <text x="300" y="540" fill="#64748b" font-family="sans-serif" font-size="12">n/a (1)</text>
  <text x="450" y="540" fill="#64748b" font-family="sans-serif" font-size="12">(1)</text>
  <rect x="650" y="525" width="130" height="22" rx="11" fill="#dcfce7"/>
