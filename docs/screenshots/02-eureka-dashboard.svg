  <text x="60" y="175" fill="#64748b" font-family="sans-serif" font-size="11">total-avail-memory: 2048 MB</text>
  <text x="60" y="192" fill="#64748b" font-family="sans-serif" font-size="11">current-memory-usage: 320 MB</text>
  <text x="360" y="175" fill="#64748b" font-family="sans-serif" font-size="11">num-of-cpus: 8</text>
  <text x="360" y="192" fill="#64748b" font-family="sans-serif" font-size="11">registered-replicas: none</text>
  <text x="660" y="175" fill="#16a34a" font-family="sans-serif" font-size="11" font-weight="bold">Self-Preservation: DISABLED</text>
  <text x="660" y="192" fill="#64748b" font-family="sans-serif" font-size="11">renewal-threshold: 8</text>

  <!-- Instances Section -->
  <text x="40" y="235" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="bold">Instances currently registered with Eureka</text>

  <!-- Table Header -->
