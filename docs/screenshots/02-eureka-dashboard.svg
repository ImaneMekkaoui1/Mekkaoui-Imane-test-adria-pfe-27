  <text x="60" y="272" fill="#334155" font-family="sans-serif" font-size="12" font-weight="bold">Application</text>
  <text x="300" y="272" fill="#334155" font-family="sans-serif" font-size="12" font-weight="bold">AMIs</text>
  <text x="450" y="272" fill="#334155" font-family="sans-serif" font-size="12" font-weight="bold">Availability Zones</text>
  <text x="650" y="272" fill="#334155" font-family="sans-serif" font-size="12" font-weight="bold">Status</text>

  <!-- Row 1: ACCOUNT-SERVICE -->
