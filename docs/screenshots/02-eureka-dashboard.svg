<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
      .hdr { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #0f172a; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #475569; }
      .val { font-family: 'SF Mono', Consolas, monospace; font-size: 12px; fill: #0f172a; }
      .th { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
      .badge-up { fill: #059669; font-family: -apple-system, sans-serif; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#f8fafc" />
  <rect x="25" y="20" width="1150" height="640" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Navbar -->
  <rect x="25" y="20" width="1150" height="60" rx="10" fill="#1e293b" />
  <rect x="25" y="60" width="1150" height="20" fill="#1e293b" />
  <text x="50" y="55" font-family="sans-serif" font-size="20" font-weight="700" fill="#ffffff">Spring Eureka Service Registry</text>
  <text x="1000" y="55" font-family="monospace" font-size="13" fill="#94a3b8">Port: 8761</text>

  <!-- Status Header -->
  <text x="50" y="115" class="hdr" font-size="17">System Status</text>
  <line x1="50" y1="125" x2="1125" y2="125" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="50" y="140" width="340" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="65" y="165" class="lbl">Environment</text>
  <text x="65" y="190" class="val">Test Adria PFE 2026 (Production-Ready)</text>

  <rect x="410" y="140" width="340" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="425" y="165" class="lbl">Data center</text>
  <text x="425" y="190" class="val">Default / Local Microservices</text>

  <rect x="770" y="140" width="355" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="785" y="165" class="lbl">Current Time</text>
  <text x="785" y="190" class="val">Fri Oct 30 11:00:00 UTC 2026</text>

  <!-- Instances Table -->
  <text x="50" y="245" class="hdr" font-size="17">Instances Currently Registered with Eureka</text>
  <line x1="50" y1="255" x2="1125" y2="255" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Table Header -->
  <rect x="50" y="270" width="1075" height="38" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="70" y="294" class="th">Application</text>
  <text x="320" y="294" class="th">AMIs</text>
  <text x="470" y="294" class="th">Availability Zones</text>
  <text x="680" y="294" class="th">Status</text>

  <!-- Rows -->
  <rect x="50" y="308" width="1075" height="42" fill="#ffffff" stroke="#f1f5f9"/>
  <text x="70" y="334" class="val" font-weight="600" fill="#2563eb">ACCOUNT-SERVICE</text>
  <text x="320" y="334" class="val">n/a (1)</text>
  <text x="470" y="334" class="val">(1)</text>
  <rect x="680" y="320" width="85" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="695" y="335" class="badge-up">UP (1)</text>
  <text x="780" y="334" class="val" fill="#64748b">192.168.1.100:account-service:8081</text>

  <rect x="50" y="350" width="1075" height="42" fill="#f8fafc" stroke="#f1f5f9"/>
  <text x="70" y="376" class="val" font-weight="600" fill="#2563eb">TRANSACTION-SERVICE</text>
  <text x="320" y="376" class="val">n/a (1)</text>
  <text x="470" y="376" class="val">(1)</text>
  <rect x="680" y="362" width="85" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="695" y="377" class="badge-up">UP (1)</text>
  <text x="780" y="376" class="val" fill="#64748b">192.168.1.100:transaction-service:8082</text>

  <rect x="50" y="392" width="1075" height="42" fill="#ffffff" stroke="#f1f5f9"/>
  <text x="70" y="418" class="val" font-weight="600" fill="#2563eb">AUDIT-SERVICE</text>
  <text x="320" y="418" class="val">n/a (1)</text>
  <text x="470" y="418" class="val">(1)</text>
  <rect x="680" y="404" width="85" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="695" y="419" class="badge-up">UP (1)</text>
  <text x="780" y="418" class="val" fill="#64748b">192.168.1.100:audit-service:8083</text>

  <rect x="50" y="434" width="1075" height="42" fill="#f8fafc" stroke="#f1f5f9"/>
  <text x="70" y="460" class="val" font-weight="600" fill="#2563eb">CHATBOT-SERVICE</text>
  <text x="320" y="460" class="val">n/a (1)</text>
  <text x="470" y="460" class="val">(1)</text>
  <rect x="680" y="446" width="85" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="695" y="461" class="badge-up">UP (1)</text>
  <text x="780" y="460" class="val" fill="#64748b">192.168.1.100:chatbot-service:8084</text>

  <rect x="50" y="476" width="1075" height="42" fill="#ffffff" stroke="#f1f5f9"/>
  <text x="70" y="502" class="val" font-weight="600" fill="#2563eb">GATEWAY-SERVICE</text>
  <text x="320" y="502" class="val">n/a (1)</text>
  <text x="470" y="502" class="val">(1)</text>
  <rect x="680" y="488" width="85" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="695" y="503" class="badge-up">UP (1)</text>
  <text x="780" y="502" class="val" fill="#64748b">192.168.1.100:gateway-service:8080</text>

  <rect x="50" y="518" width="1075" height="42" fill="#f8fafc" stroke="#f1f5f9"/>
  <text x="70" y="544" class="val" font-weight="600" fill="#2563eb">CONFIG-SERVICE</text>
  <text x="320" y="544" class="val">n/a (1)</text>
  <text x="470" y="544" class="val">(1)</text>
  <rect x="680" y="530" width="85" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="695" y="545" class="badge-up">UP (1)</text>
  <text x="780" y="544" class="val" fill="#64748b">192.168.1.100:config-service:8888</text>

  <rect x="50" y="585" width="1075" height="50" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="70" y="615" class="val" fill="#1e40af">Renouvellement du bail Eureka actif (lease renewal: 30s) - Tous les microservices operationnels</text>
</svg>