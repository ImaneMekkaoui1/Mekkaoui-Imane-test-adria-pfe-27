<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" rx="16" fill="url(#bg)"/>

  <!-- Window Header -->
  <rect width="1200" height="44" rx="16" fill="#1e293b"/>
  <rect y="30" width="1200" height="14" fill="#1e293b"/>
  <circle cx="28" cy="22" r="6" fill="#ef4444"/>
  <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="22" r="6" fill="#10b981"/>
  <text x="600" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" text-anchor="middle">Architecture Micro-Services, IA Agentique &amp; Event-Driven Platform</text>

  <!-- Section: Clients -->
  <rect x="40" y="70" width="1120" height="70" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4" filter="url(#shadow)"/>
  <text x="60" y="92" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="700">CANAUX D'ACCÈS &amp; CLIENTS</text>
  
  <rect x="60" y="100" width="220" height="30" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="170" y="120" fill="#f8fafc" font-family="sans-serif" font-size="11" text-anchor="middle">🌐 Web Client (Angular/React)</text>

  <rect x="310" y="100" width="220" height="30" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="420" y="120" fill="#f8fafc" font-family="sans-serif" font-size="11" text-anchor="middle">📱 Mobile App (Flutter)</text>

  <rect x="560" y="100" width="240" height="30" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="680" y="120" fill="#f8fafc" font-family="sans-serif" font-size="11" text-anchor="middle">💬 Bots Telegram &amp; Discord</text>

  <rect x="830" y="100" width="220" height="30" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="940" y="120" fill="#f8fafc" font-family="sans-serif" font-size="11" text-anchor="middle">💻 HTTP REST Client / Postman</text>

  <!-- Gateway -->
  <rect x="420" y="170" width="360" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="195" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🚪 Spring Cloud API Gateway (:8080)</text>
  <text x="600" y="210" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Routage dynamique • Load Balancing • Filtrage</text>

  <!-- Discovery & Config Servers -->
  <rect x="40" y="165" width="260" height="55" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="190" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🔍 Eureka Server (:8761)</text>
  <text x="170" y="206" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Service Registry &amp; Discovery</text>

  <rect x="900" y="165" width="260" height="55" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1030" y="190" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⚙️ Config Server (:8888)</text>
  <text x="1030" y="206" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">bank.transaction.max-amount=1000</text>

  <!-- Business Service 1: Account-Service -->
  <rect x="40" y="260" width="330" height="230" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="205" y="285" fill="#34d399" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">🏦 ACCOUNT-SERVICE (:8081)</text>
  <line x1="55" y1="295" x2="355" y2="295" stroke="#334155"/>
  <text x="60" y="318" fill="#94a3b8" font-family="sans-serif" font-size="11">Couches :</text>
  <text x="120" y="318" fill="#f8fafc" font-family="monospace" font-size="11">domain, repository, service</text>
  <text x="60" y="338" fill="#94a3b8" font-family="sans-serif" font-size="11">Exposition :</text>
  <text x="130" y="338" fill="#38bdf8" font-family="monospace" font-size="11">REST (/api/accounts)</text>
  <text x="130" y="354" fill="#ec4899" font-family="monospace" font-size="11">GraphQL (/graphql)</text>
  <text x="130" y="370" fill="#a855f7" font-family="monospace" font-size="11">MCP (/mcp, /api/mcp/tools)</text>
  <rect x="60" y="390" width="290" height="85" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="70" y="410" fill="#64748b" font-family="sans-serif" font-size="10">Données / Entité BankAccount :</text>
  <text x="70" y="428" fill="#f8fafc" font-family="monospace" font-size="11">• id: UUID, balance: double</text>
  <text x="70" y="446" fill="#f8fafc" font-family="monospace" font-size="11">• customerReference, currency</text>
  <text x="70" y="464" fill="#34d399" font-family="monospace" font-size="11">• status: ACTIVE | BLOCKED</text>

  <!-- Business Service 2: Transaction-Service -->
  <rect x="420" y="260" width="360" height="230" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="285" fill="#fb7185" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">💳 TRANSACTION-SERVICE (:8082)</text>
  <line x1="435" y1="295" x2="765" y2="295" stroke="#334155"/>
  <text x="440" y="318" fill="#94a3b8" font-family="sans-serif" font-size="11">Couches :</text>
  <text x="500" y="318" fill="#f8fafc" font-family="monospace" font-size="11">domain, repo, service, web</text>
  <text x="440" y="338" fill="#94a3b8" font-family="sans-serif" font-size="11">Exposition :</text>
  <text x="510" y="338" fill="#38bdf8" font-family="monospace" font-size="11">REST (/api/transactions)</text>
  <text x="510" y="354" fill="#ec4899" font-family="monospace" font-size="11">GraphQL &amp; MCP Tool Server</text>
  <rect x="440" y="370" width="320" height="105" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="450" y="390" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="bold">RÈGLES MÉTIER &amp; TOLÉRANCE :</text>
  <text x="450" y="408" fill="#f8fafc" font-family="sans-serif" font-size="10">• Montant &gt; 0 et &lt;= 1000 EUR (Config)</text>
  <text x="450" y="424" fill="#f8fafc" font-family="sans-serif" font-size="10">• Vérification devise &amp; compte actif</text>
  <text x="450" y="440" fill="#f8fafc" font-family="sans-serif" font-size="10">• OpenFeign + Resilience4J Circuit Breaker</text>
  <text x="450" y="456" fill="#a855f7" font-family="sans-serif" font-size="10">• Kafka Producer sur persist transaction</text>

  <!-- AI Chatbot Service -->
  <rect x="830" y="260" width="330" height="230" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="995" y="285" fill="#a78bfa" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">🤖 CHATBOT-SERVICE (:8084)</text>
  <line x1="845" y1="295" x2="1145" y2="295" stroke="#334155"/>
  <text x="850" y="318" fill="#94a3b8" font-family="sans-serif" font-size="11">Moteur :</text>
  <text x="910" y="318" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold">Agent IA + Spring AI</text>
  <text x="850" y="338" fill="#94a3b8" font-family="sans-serif" font-size="11">Protocole :</text>
  <text x="920" y="338" fill="#38bdf8" font-family="sans-serif" font-size="11">Model Context Protocol (MCP)</text>
  <rect x="850" y="360" width="290" height="115" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="860" y="380" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">TOOLS MCP CONNECTÉS :</text>
  <text x="860" y="398" fill="#f8fafc" font-family="monospace" font-size="10">• get_account_by_id</text>
  <text x="860" y="414" fill="#f8fafc" font-family="monospace" font-size="10">• create_bank_account</text>
  <text x="860" y="430" fill="#f8fafc" font-family="monospace" font-size="10">• create_transaction</text>
  <text x="860" y="446" fill="#f8fafc" font-family="monospace" font-size="10">• transfer_funds (Virement)</text>
  <text x="860" y="462" fill="#34d399" font-family="monospace" font-size="10">• list_all_accounts</text>

  <!-- Kafka & Audit Section -->
  <rect x="40" y="520" width="1120" height="130" rx="12" fill="#0f172a" stroke="#eab308" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="542" fill="#facc15" font-family="sans-serif" font-size="12" font-weight="bold">ÉCHANGES ASYNCHRONES EVENT-DRIVEN (APACHE KAFKA)</text>
  
  <rect x="60" y="555" width="460" height="80" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="80" y="578" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">📨 Topic: bank.transactions.created</text>
  <text x="80" y="598" fill="#94a3b8" font-family="sans-serif" font-size="11">Clé du message : <tspan fill="#f8fafc" font-family="monospace">accountId</tspan> (Garantit l'ordre par compte)</text>
  <text x="80" y="618" fill="#94a3b8" font-family="sans-serif" font-size="11">Format : <tspan fill="#34d399" font-family="monospace">eventId, transactionId, accountId, amount, currency, occurredAt</tspan></text>

  <rect x="580" y="555" width="560" height="80" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="600" y="578" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">🛡️ AUDIT-SERVICE (:8083) — Consommateur Kafka</text>
  <text x="600" y="598" fill="#94a3b8" font-family="sans-serif" font-size="11">• @KafkaListener(groupId = "audit-group") sur bank.transactions.created</text>
  <text x="600" y="618" fill="#94a3b8" font-family="sans-serif" font-size="11">• Journalisation SLF4J &amp; Stockage dans table <tspan fill="#f8fafc" font-family="monospace">audit_events</tspan> sans altérer les soldes</text>
</svg>

