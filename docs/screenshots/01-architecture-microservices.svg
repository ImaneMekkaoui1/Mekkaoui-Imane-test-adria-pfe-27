<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #0f172a; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .tag { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 600; }
      .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 4,4; }
      .arrow-solid { stroke: #2563eb; stroke-width: 2; fill: none; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8" />
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#f8fafc" />
  <rect x="20" y="20" width="1160" height="660" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>

  <text x="50" y="60" class="title" font-size="22">ARCHITECTURE MICROSERVICES BANCAIRE</text>
  <text x="50" y="82" class="subtitle">Plateforme Microservices Spring Cloud, Kafka, Spring AI (MCP) et Frontend Angular 18</text>
  <line x1="50" y1="98" x2="1130" y2="98" stroke="#f1f5f9" stroke-width="2" />

  <!-- Clients -->
  <rect x="50" y="120" width="230" height="85" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="148" class="box-title">Client Angular 18</text>
  <text x="70" y="168" class="box-desc">Single Page Application (SPA)</text>
  <text x="70" y="186" class="tag" fill="#2563eb">Port :4200 | Light Theme</text>

  <rect x="50" y="225" width="230" height="85" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="253" class="box-title">Clients Externes</text>
  <text x="70" y="273" class="box-desc">Telegram / Discord / REST API</text>
  <text x="70" y="291" class="tag" fill="#059669">Canaux Messagerie &amp; Web</text>

  <!-- Gateway -->
  <rect x="340" y="120" width="200" height="190" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="155" class="box-title" fill="#1e40af">Spring Cloud Gateway</text>
  <text x="360" y="180" class="box-desc">Routage dynamique</text>
  <text x="360" y="200" class="box-desc">Load-Balancing automatique</text>
  <text x="360" y="220" class="box-desc">CORS &amp; Filtres</text>
  <text x="360" y="280" class="tag" fill="#1d4ed8">Port :8080 (Point d Entree)</text>

  <path d="M 280 162 L 340 162" class="arrow-solid" marker-end="url(#arrowhead)"/>
  <path d="M 280 267 L 340 267" class="arrow-solid" marker-end="url(#arrowhead)"/>

  <!-- Technical -->
  <rect x="580" y="120" width="250" height="85" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="148" class="box-title">Eureka Discovery Service</text>
  <text x="600" y="168" class="box-desc">Enregistrement dynamique (Registry)</text>
  <text x="600" y="186" class="tag" fill="#475569">Port :8761</text>

  <rect x="860" y="120" width="270" height="85" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="880" y="148" class="box-title">Spring Cloud Config Server</text>
  <text x="880" y="168" class="box-desc">bank.transaction.max-amount=1000</text>
  <text x="880" y="186" class="tag" fill="#475569">Port :8888 (Centralise)</text>

  <!-- Business -->
  <rect x="580" y="235" width="250" height="200" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="580" y="235" width="250" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="600" y="258" class="box-title">Account-Service (:8081)</text>
  <text x="600" y="290" class="box-desc">Gestion des comptes &amp; Soldes</text>
  <text x="600" y="310" class="tag" fill="#2563eb">[REST] /api/accounts</text>
  <text x="600" y="330" class="tag" fill="#7c3aed">[GraphQL] /graphql</text>
  <text x="600" y="350" class="tag" fill="#0891b2">[MCP Tools] /mcp/message</text>
  <text x="600" y="380" class="box-desc">H2 Database / JPA Repository</text>
  <text x="600" y="410" class="tag" fill="#059669">Couches : Domain / Repo / Service / Web</text>

  <rect x="860" y="235" width="270" height="200" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="860" y="235" width="270" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="880" y="258" class="box-title">Transaction-Service (:8082)</text>
  <text x="880" y="290" class="box-desc">Transactions &amp; Virements</text>
  <text x="880" y="310" class="tag" fill="#2563eb">[REST] /api/transactions</text>
  <text x="880" y="330" class="tag" fill="#7c3aed">[GraphQL] /graphql</text>
  <text x="880" y="350" class="tag" fill="#0891b2">[MCP Tools] /mcp/message</text>
  <text x="880" y="380" class="box-desc">OpenFeign + Resilience4J Circuit Breaker</text>
  <text x="880" y="410" class="tag" fill="#d97706">Kafka Producer Event</text>

  <path d="M 860 300 L 830 300" class="arrow-solid" stroke="#059669" marker-end="url(#arrowhead)"/>
  <text x="835" y="290" class="tag" fill="#059669" font-size="9">Feign</text>

  <path d="M 540 250 L 580 250" class="arrow-solid" marker-end="url(#arrowhead)"/>

  <!-- Kafka -->
  <rect x="580" y="465" width="550" height="70" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="600" y="495" class="box-title" fill="#92400e">Apache Kafka Cluster (Topic : bank.transactions.created)</text>
  <text x="600" y="515" class="box-desc">Message Key = accountId | Publication evenement TransactionCreated</text>

  <path d="M 995 435 L 995 465" class="arrow-solid" stroke="#d97706" marker-end="url(#arrowhead)"/>

  <!-- Audit Service -->
  <rect x="860" y="560" width="270" height="95" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="880" y="585" class="box-title">Audit-Service (:8083)</text>
  <text x="880" y="605" class="box-desc">Kafka Consumer sans modification bancaire</text>
  <text x="880" y="625" class="box-desc">Journalisation SLF4J &amp; Historique</text>
  <text x="880" y="643" class="tag" fill="#059669">[REST] /api/audit/events</text>

  <path d="M 995 535 L 995 560" class="arrow-solid" stroke="#92400e" marker-end="url(#arrowhead)"/>

  <!-- Chatbot -->
  <rect x="220" y="465" width="320" height="190" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="220" y="465" width="320" height="34" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="240" y="488" class="box-title" fill="#1e40af">Chatbot-Service (:8084) - Spring AI</text>
  <text x="240" y="520" class="box-desc">Assistant Bancaire Conversationnel Agentique</text>
  <text x="240" y="540" class="box-desc">Connexion MCP (Model Context Protocol)</text>
  <text x="240" y="560" class="box-desc">Appel des Tools des microservices metier</text>
  <text x="240" y="585" class="tag" fill="#2563eb">get_account_balance / execute_transfer</text>
  <text x="240" y="610" class="tag" fill="#4338ca">[REST] /api/chat/message</text>
  <text x="240" y="635" class="tag" fill="#059669">Connecteurs Telegram &amp; Discord integres</text>

  <path d="M 540 540 L 580 540 L 580 435" class="arrow" marker-end="url(#arrowhead-gray)"/>
</svg>