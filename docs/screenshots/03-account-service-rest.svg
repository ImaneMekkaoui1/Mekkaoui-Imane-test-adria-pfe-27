<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Terminal Frame -->
  <rect width="1000" height="520" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect width="1000" height="40" rx="12" fill="#1e293b"/>
  <rect y="28" width="1000" height="12" fill="#1e293b"/>
  <circle cx="20" cy="20" r="5" fill="#ef4444"/>
  <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="20" r="5" fill="#10b981"/>
  <text x="500" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Terminal — Tests des Endpoints REST Account-Service (:8081)</text>

  <!-- Terminal Content -->
  <!-- Command 1: POST Account -->
  <text x="30" y="70" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">$ curl -i -X POST http://localhost:8081/api/accounts \</text>
  <text x="50" y="88" fill="#94a3b8" font-family="monospace" font-size="12">  -H "Content-Type: application/json" \</text>
  <text x="50" y="106" fill="#94a3b8" font-family="monospace" font-size="12">  -d '{"customerReference": "CUST-IMANE-2026", "currency": "EUR", "initialBalance": 3000.00}'</text>

  <text x="30" y="135" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">HTTP/1.1 201 Created</text>
  <text x="30" y="152" fill="#64748b" font-family="monospace" font-size="11">Content-Type: application/json</text>
  <text x="30" y="170" fill="#f8fafc" font-family="monospace" font-size="12">{</text>
  <text x="50" y="188" fill="#f8fafc" font-family="monospace" font-size="12">  <tspan fill="#38bdf8">"id"</tspan>: <tspan fill="#a78bfa">"c9f4d2e8-5a21-4cf1-83ef-74b889501a2d"</tspan>,</text>
  <text x="50" y="206" fill="#f8fafc" font-family="monospace" font-size="12">  <tspan fill="#38bdf8">"customerReference"</tspan>: <tspan fill="#34d399">"CUST-IMANE-2026"</tspan>,</text>
  <text x="50" y="224" fill="#f8fafc" font-family="monospace" font-size="12">  <tspan fill="#38bdf8">"status"</tspan>: <tspan fill="#34d399">"ACTIVE"</tspan>,</text>
  <text x="50" y="242" fill="#f8fafc" font-family="monospace" font-size="12">  <tspan fill="#38bdf8">"currency"</tspan>: <tspan fill="#34d399">"EUR"</tspan>,</text>
  <text x="50" y="260" fill="#f8fafc" font-family="monospace" font-size="12">  <tspan fill="#38bdf8">"balance"</tspan>: <tspan fill="#f59e0b">3000.0</tspan></text>
  <text x="30" y="278" fill="#f8fafc" font-family="monospace" font-size="12">}</text>

  <!-- Command 2: GET Account -->
  <line x1="30" y1="305" x2="970" y2="305" stroke="#334155" stroke-dasharray="4"/>
  <text x="30" y="335" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">$ curl -i http://localhost:8081/api/accounts/11111111-1111-1111-1111-111111111111</text>

  <text x="30" y="362" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">HTTP/1.1 200 OK</text>
  <text x="30" y="380" fill="#64748b" font-family="monospace" font-size="11">Content-Type: application/json</text>
  <text x="30" y="398" fill="#f8fafc" font-family="monospace" font-size="12">{</text>
  <text x="50" y="416" fill="#f8fafc" font-family="monospace" font-size="12">  <tspan fill="#38bdf8">"id"</tspan>: <tspan fill="#a78bfa">"11111111-1111-1111-1111-111111111111"</tspan>,</text>
  <text x="50" y="434" fill="#f8fafc" font-family="monospace" font-size="12">  <tspan fill="#38bdf8">"customerReference"</tspan>: <tspan fill="#34d399">"CUST-1001"</tspan>,</text>
  <text x="50" y="452" fill="#f8fafc" font-family="monospace" font-size="12">  <tspan fill="#38bdf8">"status"</tspan>: <tspan fill="#34d399">"ACTIVE"</tspan>,</text>
  <text x="50" y="470" fill="#f8fafc" font-family="monospace" font-size="12">  <tspan fill="#38bdf8">"currency"</tspan>: <tspan fill="#34d399">"EUR"</tspan>,</text>
  <text x="50" y="488" fill="#f8fafc" font-family="monospace" font-size="12">  <tspan fill="#38bdf8">"balance"</tspan>: <tspan fill="#f59e0b">5000.0</tspan></text>
  <text x="30" y="506" fill="#f8fafc" font-family="monospace" font-size="12">}</text>
</svg>

