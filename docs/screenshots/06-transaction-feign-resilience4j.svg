<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%">
  <defs>
    <style>
      .code { font-family: 'SF Mono', Consolas, 'Courier New', monospace; font-size: 12px; }
      .lbl { font-family: sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: sans-serif; font-size: 12px; fill: #475569; }
    </style>
  </defs>

  <rect width="1100" height="620" fill="#f8fafc" />
  <rect x="25" y="20" width="1050" height="580" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <rect x="25" y="20" width="1050" height="45" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="50" cy="42" r="6" fill="#ef4444"/>
  <circle cx="70" cy="42" r="6" fill="#f59e0b"/>
  <circle cx="90" cy="42" r="6" fill="#10b981"/>
  <text x="120" y="47" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">OpenFeign &amp; Resilience4J Circuit Breaker - Transaction-Service</text>

  <rect x="50" y="85" width="480" height="485" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="50" y="85" width="480" height="36" rx="6" fill="#eff6ff"/>
  <text x="70" y="108" class="lbl" fill="#1e40af">Execution de Transaction &amp; Appel OpenFeign</text>

  <rect x="70" y="135" width="440" height="90" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="85" y="160" class="desc" font-weight="600">1. Verification regles metier :</text>
  <text x="85" y="180" class="code" fill="#059669">- Montant &gt; 0 et &lt;= 1000 EUR (Config Server)</text>
  <text x="85" y="200" class="code" fill="#059669">- Devise concordante (EUR == EUR)</text>

  <rect x="70" y="240" width="440" height="110" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="85" y="265" class="desc" font-weight="600">2. Consultation Solde via OpenFeign :</text>
  <text x="85" y="285" class="code" fill="#2563eb">AccountServiceClient.getAccountById(accountId)</text>
  <text x="85" y="305" class="code" fill="#64748b">- Solde avant transaction : 2500.0 EUR</text>
  <text x="85" y="325" class="code" fill="#64748b">- Solde apres debit (250 EUR) : 2250.0 EUR</text>

  <rect x="70" y="365" width="440" height="185" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="85" y="390" class="desc" font-weight="600">3. Persistance &amp; Evenement Kafka :</text>
  <text x="85" y="415" class="code" fill="#0f172a">Transaction ID: 9f8e7d6c-5b4a-3f2e-1d0c-9b8a7f6e5d4c</text>
  <text x="85" y="440" class="code" fill="#0f172a">Montant debite: 250.00 EUR</text>
  <text x="85" y="465" class="code" fill="#d97706">Kafka Topic: bank.transactions.created</text>
  <text x="85" y="490" class="code" fill="#059669">Statut: TRANSACTION PERSISTEE AVEC SUCCES</text>

  <rect x="560" y="85" width="485" height="485" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="560" y="85" width="485" height="36" rx="6" fill="#f1f5f9"/>
  <text x="580" y="108" class="lbl">Etat du Circuit Breaker Resilience4J</text>

  <rect x="580" y="135" width="445" height="100" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="600" y="165" font-family="sans-serif" font-size="14" font-weight="700" fill="#065f46">ETAT DU CIRCUIT : CLOSED (Normal)</text>
  <text x="600" y="190" class="code" fill="#047857">Taux d echec: 0.0% (Seuil configure: 50%)</text>
  <text x="600" y="215" class="code" fill="#047857">Appels reussis: 48 / 48 (100% disponibilite)</text>

  <rect x="580" y="250" width="445" height="120" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="600" y="275" class="desc" font-weight="600">Configuration Resilience4J :</text>
  <text x="600" y="295" class="code" fill="#475569">- sliding-window-type: COUNT_BASED (10)</text>
  <text x="600" y="315" class="code" fill="#475569">- wait-duration-in-open-state: 5000ms</text>
  <text x="600" y="335" class="code" fill="#475569">- permitted-number-of-calls-in-half-open: 3</text>
  <text x="600" y="355" class="code" fill="#475569">- failure-rate-threshold: 50%</text>

  <rect x="580" y="385" width="445" height="165" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="600" y="410" class="desc" font-weight="600" fill="#1e40af">Mecanisme de Fallback :</text>
  <text x="600" y="435" class="code" fill="#1d4ed8">AccountServiceClientFallback.java</text>
  <text x="600" y="460" class="desc">En cas d indisponibilite de l Account-Service,</text>
  <text x="600" y="480" class="desc">le circuit bascule en OPEN et le fallback renvoie</text>
  <text x="600" y="500" class="desc">un compte degrade empechant le blocage en cascade.</text>
</svg>