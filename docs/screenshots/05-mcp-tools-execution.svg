  <text x="655" y="355" class="code"><tspan fill="#0f172a" font-weight="600">"text"</tspan>: <tspan fill="#047857">"Solde du compte a1b2c3d4... : 2500.0 EUR (Statut: ACTIVE)"</tspan></text>
  <text x="635" y="385" class="code">}</text>
  <text x="615" y="415" class="code">],</text>
