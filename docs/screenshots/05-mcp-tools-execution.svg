<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <!-- Terminal Frame -->
  <rect width="1000" height="520" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1.5"/>
  <rect width="1000" height="40" rx="12" fill="#1e293b"/>
  <rect y="28" width="1000" height="12" fill="#1e293b"/>
  <circle cx="20" cy="20" r="5" fill="#ef4444"/>
  <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="20" r="5" fill="#10b981"/>
  <text x="500" y="24" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Model Context Protocol (Anthropic MCP JSON-RPC 2.0) — /mcp &amp; /api/mcp/tools</text>

  <!-- Command -->
  <text x="30" y="70" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">$ curl -i -X POST http://localhost:8081/mcp \</text>
  <text x="50" y="88" fill="#94a3b8" font-family="monospace" font-size="12">  -H "Content-Type: application/json" \</text>
  <text x="50" y="106" fill="#94a3b8" font-family="monospace" font-size="12">  -d '{</text>
  <text x="70" y="124" fill="#f8fafc" font-family="monospace" font-size="12">    <tspan fill="#38bdf8">"jsonrpc"</tspan>: <tspan fill="#34d399">"2.0"</tspan>,</text>
  <text x="70" y="142" fill="#f8fafc" font-family="monospace" font-size="12">    <tspan fill="#38bdf8">"id"</tspan>: <tspan fill="#f59e0b">1</tspan>,</text>
  <text x="70" y="160" fill="#f8fafc" font-family="monospace" font-size="12">    <tspan fill="#38bdf8">"method"</tspan>: <tspan fill="#ec4899">"tools/call"</tspan>,</text>
  <text x="70" y="178" fill="#f8fafc" font-family="monospace" font-size="12">    <tspan fill="#38bdf8">"params"</tspan>: {</text>
  <text x="90" y="196" fill="#f8fafc" font-family="monospace" font-size="12">      <tspan fill="#38bdf8">"name"</tspan>: <tspan fill="#c084fc">"get_account_by_id"</tspan>,</text>
  <text x="90" y="214" fill="#f8fafc" font-family="monospace" font-size="12">      <tspan fill="#38bdf8">"arguments"</tspan>: { <tspan fill="#38bdf8">"id"</tspan>: <tspan fill="#a78bfa">"11111111-1111-1111-1111-111111111111"</tspan> }</text>
  <text x="70" y="232" fill="#f8fafc" font-family="monospace" font-size="12">    }</text>
  <text x="50" y="250" fill="#94a3b8" font-family="monospace" font-size="12">  }'</text>

  <!-- Divider -->
  <line x1="30" y1="270" x2="970" y2="270" stroke="#334155"/>

  <!-- Response -->
  <text x="30" y="295" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">HTTP/1.1 200 OK</text>
  <text x="30" y="312" fill="#64748b" font-family="monospace" font-size="11">Content-Type: application/json;charset=UTF-8</text>
  <text x="30" y="332" fill="#f8fafc" font-family="monospace" font-size="12">{</text>
  <text x="50" y="350" fill="#f8fafc" font-family="monospace" font-size="12">  <tspan fill="#38bdf8">"jsonrpc"</tspan>: <tspan fill="#34d399">"2.0"</tspan>,</text>
  <text x="50" y="368" fill="#f8fafc" font-family="monospace" font-size="12">  <tspan fill="#38bdf8">"id"</tspan>: <tspan fill="#f59e0b">1</tspan>,</text>
  <text x="50" y="386" fill="#f8fafc" font-family="monospace" font-size="12">  <tspan fill="#38bdf8">"result"</tspan>: {</text>
  <text x="70" y="404" fill="#f8fafc" font-family="monospace" font-size="12">    <tspan fill="#38bdf8">"isError"</tspan>: <tspan fill="#f59e0b">false</tspan>,</text>
  <text x="70" y="422" fill="#f8fafc" font-family="monospace" font-size="12">    <tspan fill="#38bdf8">"content"</tspan>: [</text>
  <text x="90" y="440" fill="#f8fafc" font-family="monospace" font-size="12">      {</text>
  <text x="110" y="458" fill="#f8fafc" font-family="monospace" font-size="12">        <tspan fill="#38bdf8">"type"</tspan>: <tspan fill="#34d399">"text"</tspan>,</text>
  <text x="110" y="476" fill="#f8fafc" font-family="monospace" font-size="12">        <tspan fill="#38bdf8">"text"</tspan>: <tspan fill="#34d399">"{\"id\":\"11111111-1111-1111-1111-111111111111\",\"customerReference\":\"CUST-1001\",\"balance\":5000.0,\"currency\":\"EUR\",\"status\":\"ACTIVE\"}"</tspan></text>
  <text x="90" y="494" fill="#f8fafc" font-family="monospace" font-size="12">      }</text>
  <text x="70" y="508" fill="#f8fafc" font-family="monospace" font-size="12">    ]</text>
  <text x="50" y="515" fill="#f8fafc" font-family="monospace" font-size="12">  }</text>
</svg>

