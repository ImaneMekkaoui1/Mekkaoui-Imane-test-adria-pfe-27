  <text x="575" y="101" class="lbl" fill="#065f46">REPONSE DU SERVEUR MCP</text>

  <text x="575" y="145" class="code" fill="#64748b">{</text>
  <text x="595" y="175" class="code"><tspan fill="#0f172a" font-weight="600">"jsonrpc"</tspan>: <tspan fill="#047857">"2.0"</tspan>,</text>
  <text x="595" y="205" class="code"><tspan fill="#0f172a" font-weight="600">"id"</tspan>: <tspan fill="#2563eb">1</tspan>,</text>
  <text x="595" y="235" class="code"><tspan fill="#0f172a" font-weight="600">"result"</tspan>: {</text>
  <text x="615" y="265" class="code"><tspan fill="#0f172a" font-weight="600">"content"</tspan>: [</text>
  <text x="635" y="295" class="code">{</text>
