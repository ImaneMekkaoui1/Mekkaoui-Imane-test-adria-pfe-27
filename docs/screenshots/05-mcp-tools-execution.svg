  <text x="85" y="205" class="code"><tspan fill="#0f172a" font-weight="600">"id"</tspan>: <tspan fill="#2563eb">1</tspan>,</text>
  <text x="85" y="235" class="code"><tspan fill="#0f172a" font-weight="600">"method"</tspan>: <tspan fill="#7c3aed" font-weight="600">"tools/call"</tspan>,</text>
  <text x="85" y="265" class="code"><tspan fill="#0f172a" font-weight="600">"params"</tspan>: {</text>
  <text x="110" y="295" class="code"><tspan fill="#0f172a" font-weight="600">"name"</tspan>: <tspan fill="#d97706" font-weight="600">"get_account_balance"</tspan>,</text>
  <text x="110" y="325" class="code"><tspan fill="#0f172a" font-weight="600">"arguments"</tspan>: {</text>
  <text x="135" y="355" class="code"><tspan fill="#0f172a" font-weight="600">"accountId"</tspan>: <tspan fill="#047857">"a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"</tspan></text>
  <text x="110" y="385" class="code">}</text>
  <text x="85" y="415" class="code">}</text>
  <text x="65" y="445" class="code" fill="#64748b">}</text>

