  <text x="85" y="470" class="code" fill="#475569">- Cle de partitionnement : accountId (Garantit l ordre)</text>
  <text x="85" y="495" class="code" fill="#475569">- Serializer : JsonSerializer &amp; StringSerializer</text>
  <text x="85" y="520" class="code" fill="#059669">- Publication synchrone apres commit DB</text>

