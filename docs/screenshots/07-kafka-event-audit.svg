<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <!-- Frame -->
  <rect width="1000" height="520" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect width="1000" height="40" rx="12" fill="#1e293b"/>
  <rect y="28" width="1000" height="12" fill="#1e293b"/>
  <circle cx="20" cy="20" r="5" fill="#ef4444"/>
  <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="20" r="5" fill="#10b981"/>
  <text x="500" y="24" fill="#eab308" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Journalisation Asynchrone Kafka — Audit-Service (:8083) Logs &amp; Events</text>

  <!-- Kafka Producer Log -->
  <text x="30" y="70" fill="#94a3b8" font-family="monospace" font-size="11">2026-10-30T10:45:12.102+01:00 <tspan fill="#38bdf8">INFO</tspan> [transaction-service] c.a.b.t.s.TransactionEventProducer :</text>
  <text x="50" y="88" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">Publishing TransactionCreatedEvent to topic [bank.transactions.created] with key [11111111-1111-1111-1111-111111111111]:</text>
  <text x="50" y="106" fill="#f8fafc" font-family="monospace" font-size="11">TransactionCreatedEvent[eventId=e9a0846d-..., eventType=TransactionCreated, amount=250.00, currency=EUR]</text>

  <!-- Divider -->
  <line x1="30" y1="125" x2="970" y2="125" stroke="#334155"/>

  <!-- Kafka Consumer Log -->
  <text x="30" y="150" fill="#94a3b8" font-family="monospace" font-size="11">2026-10-30T10:45:12.155+01:00 <tspan fill="#38bdf8">INFO</tspan> [audit-service] c.a.b.a.s.KafkaTransactionConsumer :</text>
  <text x="30" y="170" fill="#64748b" font-family="monospace" font-size="11">================================================================================</text>
  <text x="30" y="188" fill="#facc15" font-family="monospace" font-size="11" font-weight="bold">[AUDIT KAFKA CONSUMER] Event received from partition 0 with offset 12</text>
  <text x="30" y="206" fill="#f8fafc" font-family="monospace" font-size="11">[AUDIT KAFKA CONSUMER] Message Key (accountId): <tspan fill="#a78bfa">11111111-1111-1111-1111-111111111111</tspan></text>
  <text x="30" y="224" fill="#38bdf8" font-family="monospace" font-size="11">[AUDIT EVENT LOG] eventId=e9a0846d-a1c2-48f8-b57e-399d8b375e21, eventType=TransactionCreated,</text>
  <text x="50" y="242" fill="#38bdf8" font-family="monospace" font-size="11">transactionId=b1b6d132-0545-420a-8bf8-2fa521f1d198, amount=250.00 EUR, occurredAt=2026-10-30T10:45:12Z</text>
  <text x="30" y="260" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">[AUDIT SAVED] Audit record successfully persisted in audit database (audit_events table).</text>
  <text x="30" y="278" fill="#64748b" font-family="monospace" font-size="11">================================================================================</text>

  <!-- Querying Audit REST API -->
  <line x1="30" y1="300" x2="970" y2="300" stroke="#334155" stroke-dasharray="3"/>
  <text x="30" y="325" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">$ curl http://localhost:8083/api/audit/events</text>

  <text x="30" y="350" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">HTTP/1.1 200 OK</text>
  <text x="30" y="370" fill="#f8fafc" font-family="monospace" font-size="12">[</text>
  <text x="50" y="388" fill="#f8fafc" font-family="monospace" font-size="12">  {</text>
  <text x="70" y="406" fill="#f8fafc" font-family="monospace" font-size="12">    <tspan fill="#38bdf8">"eventId"</tspan>: <tspan fill="#a78bfa">"e9a0846d-a1c2-48f8-b57e-399d8b375e21"</tspan>,</text>
  <text x="70" y="424" fill="#f8fafc" font-family="monospace" font-size="12">    <tspan fill="#38bdf8">"eventType"</tspan>: <tspan fill="#34d399">"TransactionCreated"</tspan>,</text>
  <text x="70" y="442" fill="#f8fafc" font-family="monospace" font-size="12">    <tspan fill="#38bdf8">"accountId"</tspan>: <tspan fill="#a78bfa">"11111111-1111-1111-1111-111111111111"</tspan>,</text>
  <text x="70" y="460" fill="#f8fafc" font-family="monospace" font-size="12">    <tspan fill="#38bdf8">"amount"</tspan>: <tspan fill="#f59e0b">250.0</tspan>, <tspan fill="#38bdf8">"currency"</tspan>: <tspan fill="#34d399">"EUR"</tspan>,</text>
  <text x="70" y="478" fill="#f8fafc" font-family="monospace" font-size="12">    <tspan fill="#38bdf8">"occurredAt"</tspan>: <tspan fill="#94a3b8">"2026-10-30T10:45:12Z"</tspan></text>
  <text x="50" y="496" fill="#f8fafc" font-family="monospace" font-size="12">  }</text>
  <text x="30" y="512" fill="#f8fafc" font-family="monospace" font-size="12">]</text>
</svg>

