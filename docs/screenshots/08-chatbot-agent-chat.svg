      .code { font-family: 'SF Mono', Consolas, 'Courier New', monospace; font-size: 12px; }
      .lbl { font-family: sans-serif; font-size: 13px; font-weight: 700; }
      .bubble { font-family: sans-serif; font-size: 13px; }
    </style>
  </defs>

  <rect width="1100" height="620" fill="#f8fafc" />
  <rect x="25" y="20" width="1050" height="580" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <rect x="25" y="20" width="1050" height="45" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="50" cy="42" r="6" fill="#ef4444"/>
  <circle cx="70" cy="42" r="6" fill="#f59e0b"/>
  <circle cx="90" cy="42" r="6" fill="#10b981"/>
  <text x="120" y="47" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Spring AI Agentic Banking Assistant - Model Context Protocol (MCP)</text>

  <rect x="50" y="85" width="550" height="485" rx="6" fill="#fafafa" stroke="#cbd5e1"/>
  <rect x="50" y="85" width="550" height="36" rx="6" fill="#eff6ff"/>
  <text x="70" y="108" class="lbl" fill="#1e40af">Session Conversationnelle Client</text>

  <rect x="180" y="135" width="400" height="55" rx="8" fill="#2563eb"/>
