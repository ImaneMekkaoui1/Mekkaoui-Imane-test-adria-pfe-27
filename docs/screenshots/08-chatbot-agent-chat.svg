<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <!-- Frame -->
  <rect width="1000" height="560" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect width="1000" height="42" rx="14" fill="#1e293b"/>
  <rect y="30" width="1000" height="12" fill="#1e293b"/>
  <circle cx="22" cy="21" r="5" fill="#ef4444"/>
  <circle cx="38" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="54" cy="21" r="5" fill="#10b981"/>
  <text x="500" y="25" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">🤖 Assistant Bancaire Agentique IA — Spring AI &amp; Model Context Protocol (:8084)</text>

  <!-- Chat container -->
  <rect x="30" y="60" width="940" height="480" rx="10" fill="#182234" stroke="#1e293b"/>

  <!-- Message 1: User -->
  <rect x="420" y="80" width="530" height="44" rx="8" fill="#2563eb"/>
  <text x="435" y="106" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12">👤 Bonjour, quel est le solde de mon compte 11111111-1111-1111-1111-111111111111 ?</text>

  <!-- Message 1: Bot response -->
  <rect x="50" y="135" width="620" height="85" rx="8" fill="#1e293b" stroke="#3b82f6"/>
  <text x="65" y="158" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">🤖 Assistant IA (Tool exécuté: get_account_by_id via MCP) :</text>
  <text x="65" y="180" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12">Voici les détails de votre compte bancaire :</text>
  <text x="65" y="200" fill="#34d399" font-family="monospace" font-size="11">Solde disponible : 5 000.00 EUR | Statut : ACTIF | Réf : CUST-1001</text>

  <!-- Message 2: User Transfer -->
  <rect x="340" y="235" width="610" height="44" rx="8" fill="#2563eb"/>
  <text x="355" y="261" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12">👤 Peux-tu faire un virement de 100 EUR de ce compte vers 22222222-2222-2222-2222-222222222222 ?</text>

  <!-- Message 2: Bot response -->
  <rect x="50" y="290" width="700" height="110" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="65" y="313" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold">🤖 Assistant IA (Tool exécuté: transfer_funds via MCP sur Transaction-Service) :</text>
  <text x="65" y="335" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12">✅ Virement de 100.00 EUR exécuté avec succès !</text>
  <text x="65" y="355" fill="#94a3b8" font-family="monospace" font-size="11">• Débit émetteur (11111111) : Nouveau solde = 4 900.00 EUR</text>
  <text x="65" y="373" fill="#94a3b8" font-family="monospace" font-size="11">• Crédit bénéficiaire (22222222) : Nouveau solde = 1 600.00 EUR</text>
  <text x="65" y="391" fill="#a78bfa" font-family="monospace" font-size="11">• Événement Kafka émis sur topic bank.transactions.created</text>

  <!-- Input bar mockup -->
  <rect x="50" y="480" width="800" height="42" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="70" y="506" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Posez une question ou demandez une opération bancaire...</text>
  <rect x="860" y="480" width="90" height="42" rx="8" fill="#3b82f6"/>
  <text x="905" y="506" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Envoyer</text>
</svg>

