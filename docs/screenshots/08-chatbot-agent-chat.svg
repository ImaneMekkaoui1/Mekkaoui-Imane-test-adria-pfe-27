  <text x="200" y="178" font-family="sans-serif" font-size="10" fill="#bfdbfe">Utilisateur - 10:48</text>

  <rect x="70" y="205" width="440" height="135" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="85" y="218" width="280" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="95" y="234" class="code" fill="#1d4ed8" font-weight="600">Appel Tool MCP : get_account_balance</text>
  <text x="85" y="265" class="bubble" fill="#0f172a">Votre compte principal (ref: CUST-ADRIA-001)</text>
  <text x="85" y="285" class="bubble" fill="#0f172a">presente un solde de 2 500,00 EUR.</text>
  <text x="85" y="305" class="bubble" fill="#059669" font-weight="600">Statut du compte : ACTIVE.</text>
  <text x="85" y="325" font-family="sans-serif" font-size="10" fill="#94a3b8">Assistant IA - 10:48</text>

  <rect x="180" y="355" width="400" height="55" rx="8" fill="#2563eb"/>
  <text x="200" y="380" class="bubble" fill="#ffffff" font-weight="500">Effectue un virement de 250 EUR vers CUST-002</text>
  <text x="200" y="398" font-family="sans-serif" font-size="10" fill="#bfdbfe">Utilisateur - 10:49</text>

  <rect x="70" y="425" width="440" height="130" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="85" y="438" width="280" height="24" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="95" y="454" class="code" fill="#15803d" font-weight="600">Appel Tool MCP : execute_transfer</text>
  <text x="85" y="485" class="bubble" fill="#0f172a">Virement de 250,00 EUR execute avec succes !</text>
  <text x="85" y="505" class="bubble" fill="#0f172a">Nouveau solde : 2 250,00 EUR.</text>
  <text x="85" y="525" class="bubble" fill="#d97706">Evenement Kafka publie sur le topic.</text>
  <text x="85" y="543" font-family="sans-serif" font-size="10" fill="#94a3b8">Assistant IA - 10:49</text>

  <rect x="630" y="85" width="415" height="485" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="630" y="85" width="415" height="36" rx="6" fill="#f1f5f9"/>
  <text x="650" y="108" class="lbl">Orchestration &amp; Architecture MCP</text>

