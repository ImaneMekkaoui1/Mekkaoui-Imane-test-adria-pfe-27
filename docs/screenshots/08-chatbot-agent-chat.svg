  <text x="665" y="285" font-family="sans-serif" font-size="12" font-weight="600" fill="#0f172a">Tools MCP Disponibles :</text>
  <text x="665" y="310" class="code" fill="#2563eb">1. get_account_balance(accountId)</text>
  <text x="665" y="335" class="code" fill="#2563eb">2. execute_transfer(src, dst, amount, curr)</text>
  <text x="665" y="360" class="code" fill="#2563eb">3. list_customer_accounts(customerId)</text>
  <text x="665" y="385" class="code" fill="#2563eb">4. get_account_transactions(accountId)</text>

  <rect x="650" y="415" width="375" height="140" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="665" y="440" font-family="sans-serif" font-size="12" font-weight="600" fill="#15803d">Clients Supportes :</text>
  <text x="665" y="465" font-family="sans-serif" font-size="12" fill="#334155">- Interface Web Angular 18 (integree)</text>
  <text x="665" y="490" font-family="sans-serif" font-size="12" fill="#334155">- Client Bot Telegram (Webhook / Polling)</text>
  <text x="665" y="515" font-family="sans-serif" font-size="12" fill="#334155">- Client Bot Discord (Gateway API)</text>
  <text x="665" y="540" font-family="sans-serif" font-size="12" fill="#334155">- API REST standard (/api/chat/message)</text>
