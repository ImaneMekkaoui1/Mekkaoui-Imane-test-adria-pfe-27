  <text x="665" y="185" class="code" fill="#475569">- Framework: Spring AI (McpClientService)</text>
  <text x="665" y="205" class="code" fill="#475569">- Protocole: Model Context Protocol (v2.0)</text>
  <text x="665" y="225" class="code" fill="#475569">- Format d echange: JSON-RPC over HTTP</text>

