<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <style>
      .app-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #0f172a; }
      .app-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .tab-btn { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; }
      .chat-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; }
      .chip-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #334155; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#f8fafc" />
  <rect x="20" y="15" width="1160" height="670" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <rect x="20" y="15" width="1160" height="65" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <rect x="45" y="30" width="36" height="36" rx="8" fill="#2563eb" />
  <text x="56" y="54" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">A</text>

  <text x="95" y="45" class="app-title" font-size="18">Adria Bank</text>
  <text x="95" y="60" class="app-sub">Plateforme Microservices &amp; IA Agentique</text>

  <rect x="340" y="30" width="115" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="365" y="53" class="tab-btn" fill="#64748b">Comptes</text>

  <rect x="465" y="30" width="200" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="53" class="tab-btn" fill="#64748b">Transactions &amp; Virements</text>

  <rect x="675" y="30" width="165" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="690" y="53" class="tab-btn" fill="#64748b">Piste d Audit Kafka</text>

  <rect x="850" y="30" width="130" height="36" rx="6" fill="#2563eb"/>
  <text x="865" y="53" class="tab-btn" fill="#ffffff">Assistant IA</text>

  <rect x="1000" y="34" width="155" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="1015" cy="48" r="4" fill="#10b981" />
  <text x="1026" y="52" font-family="sans-serif" font-size="11" font-weight="600" fill="#047857">Gateway :8080 Connectee</text>

  <rect x="45" y="105" width="1110" height="555" rx="8" fill="#ffffff" stroke="#e2e8f0"/>

  <rect x="45" y="105" width="1110" height="55" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="75" cy="132" r="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="68" y="137" font-family="sans-serif" font-size="12" font-weight="700" fill="#2563eb">IA</text>
  <text x="100" y="132" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a">Assistant Bancaire Intelligent (Spring AI &amp; MCP)</text>
  <text x="100" y="148" font-family="sans-serif" font-size="11" fill="#64748b">Connecte aux serveurs MCP des microservices metier</text>

  <rect x="980" y="118" width="150" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="1000" y="136" font-family="sans-serif" font-size="11" font-weight="700" fill="#047857">MCP Tools Actifs</text>

  <rect x="65" y="180" width="550" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="85" y="205" class="chat-text" fill="#0f172a">Bonjour. Je suis l assistant bancaire intelligent d Adria Bank.</text>
  <text x="85" y="225" class="chat-text" fill="#0f172a">Comment puis-je vous assister aujourd hui ?</text>
  <text x="550" y="232" font-family="sans-serif" font-size="10" fill="#94a3b8">10:47</text>

  <rect x="680" y="260" width="450" height="50" rx="8" fill="#2563eb"/>
  <text x="700" y="290" class="chat-text" fill="#ffffff">Quel est le solde de mon compte principal ?</text>
  <text x="1075" y="302" font-family="sans-serif" font-size="10" fill="#bfdbfe">10:48</text>

  <rect x="65" y="330" width="620" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="85" y="345" width="310" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="95" y="361" font-family="monospace" font-size="11" font-weight="600" fill="#1d4ed8">Action MCP executee : get_account_balance</text>
  <text x="85" y="395" class="chat-text" fill="#0f172a">Votre compte principal (reference CUST-ADRIA-001) a un solde</text>
  <text x="85" y="415" class="chat-text" fill="#0f172a">actuel de 2 500,00 EUR. Le statut est ACTIVE.</text>
  <text x="620" y="432" font-family="sans-serif" font-size="10" fill="#94a3b8">10:48</text>

  <rect x="65" y="555" width="220" height="32" rx="16" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="85" y="575" class="chip-text">Solde du compte principal</text>

  <rect x="300" y="555" width="180" height="32" rx="16" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="320" y="575" class="chip-text">Virement de 100 EUR</text>

  <rect x="495" y="555" width="160" height="32" rx="16" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="515" y="575" class="chip-text">Nouveau compte</text>

  <rect x="65" y="600" width="940" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="85" y="626" font-family="sans-serif" font-size="13" fill="#94a3b8">Posez une question a l assistant bancaire...</text>

  <rect x="1020" y="600" width="115" height="42" rx="6" fill="#2563eb"/>
  <text x="1055" y="626" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Envoyer</text>
</svg>