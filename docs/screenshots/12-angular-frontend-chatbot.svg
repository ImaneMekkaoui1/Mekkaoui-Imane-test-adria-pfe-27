<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <!-- Browser Frame (Light Theme) -->
  <rect width="1200" height="700" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect width="1200" height="42" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect y="30" width="1200" height="12" fill="#ffffff"/>
  <circle cx="22" cy="21" r="5" fill="#ef4444"/>
  <circle cx="38" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="54" cy="21" r="5" fill="#10b981"/>
  
  <rect x="140" y="8" width="920" height="26" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="160" y="25" fill="#475569" font-family="-apple-system, sans-serif" font-size="12">🔒 http://localhost:4200/chatbot — Adria Bank (Assistant IA Agentique &amp; MCP)</text>

  <!-- Header -->
  <rect y="42" width="1200" height="70" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="55" width="44" height="44" rx="10" fill="#2563eb"/>
  <text x="62" y="84" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900" text-anchor="middle">A</text>
  <text x="96" y="74" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="800">Adria Bank</text>
  <text x="96" y="92" fill="#64748b" font-family="sans-serif" font-size="11">Plateforme Microservices &amp; IA Agentique</text>

  <!-- Nav Tabs -->
  <rect x="400" y="56" width="500" height="42" rx="8" fill="#f1f5f9"/>
  <text x="454" y="82" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">💳 Comptes</text>
  <text x="565" y="82" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">💸 Virements</text>
  <text x="685" y="82" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛡️ Piste Kafka</text>
  <rect x="750" y="60" width="145" height="34" rx="6" fill="#ffffff"/>
  <text x="822" y="82" fill="#2563eb" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">🤖 Assistant IA</text>

  <rect x="980" y="62" width="180" height="30" rx="15" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="995" cy="77" r="4" fill="#10b981"/>
  <text x="1005" y="82" fill="#047857" font-family="sans-serif" font-size="11" font-weight="bold">Gateway :8080 Connectée</text>

  <!-- Chat Container Card (Clean Light Theme) -->
  <rect x="40" y="130" width="1120" height="545" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Chat Card Header -->
  <rect x="60" y="145" width="46" height="46" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="83" y="175" fill="#2563eb" font-size="22" text-anchor="middle">🤖</text>
  <text x="120" y="166" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="800">Assistant Bancaire Intelligent (Chatbot Agentique)</text>
  <text x="120" y="184" fill="#64748b" font-family="sans-serif" font-size="11">Propulsé par Spring AI &amp; Model Context Protocol (MCP) — Tools dynamiques</text>

  <rect x="1010" y="152" width="130" height="26" rx="13" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="1075" y="169" fill="#6d28d9" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MCP Tools Connectés</text>

  <line x1="40" y1="205" x2="1160" y2="205" stroke="#f1f5f9"/>

  <!-- Conversation Area -->
  <!-- Bot Message 1 -->
  <rect x="60" y="220" width="560" height="58" rx="10" fill="#f1f5f9"/>
  <text x="80" y="244" fill="#0f172a" font-family="sans-serif" font-size="13">Bonjour ! Je suis l'assistant bancaire IA d'Adria Bank.</text>
  <text x="80" y="264" fill="#475569" font-family="sans-serif" font-size="12">Je peux consulter vos soldes, créer des comptes ou exécuter des virements sécurisés.</text>
  <text x="590" y="270" fill="#94a3b8" font-family="sans-serif" font-size="10">10:45</text>

  <!-- User Message 1 -->
  <rect x="680" y="295" width="460" height="42" rx="10" fill="#2563eb"/>
  <text x="700" y="321" fill="#ffffff" font-family="sans-serif" font-size="13">Quel est le solde de mon compte principal ?</text>
  <text x="1110" y="330" fill="#bfdbfe" font-family="sans-serif" font-size="10">10:46</text>

  <!-- Bot Message 2 (Tool get_account_by_id) -->
  <rect x="60" y="350" width="650" height="85" rx="10" fill="#f1f5f9"/>
  <text x="80" y="375" fill="#0f172a" font-family="sans-serif" font-size="13">Votre compte principal (CUST-1001) a un solde actuel de :</text>
  <text x="80" y="398" fill="#047857" font-family="sans-serif" font-size="14" font-weight="bold">5 000.00 EUR  (Statut: ACTIVE)</text>
  <rect x="80" y="408" width="260" height="20" rx="4" fill="#e2e8f0"/>
  <text x="90" y="422" fill="#334155" font-family="monospace" font-size="10">🔧 Tool MCP : get_account_by_id</text>
  <text x="680" y="425" fill="#94a3b8" font-family="sans-serif" font-size="10">10:46</text>

  <!-- User Message 2 -->
  <rect x="600" y="448" width="540" height="42" rx="10" fill="#2563eb"/>
  <text x="620" y="474" fill="#ffffff" font-family="sans-serif" font-size="13">Peux-tu faire un virement de 100 EUR vers le compte CUST-1002 ?</text>
  <text x="1110" y="483" fill="#bfdbfe" font-family="sans-serif" font-size="10">10:47</text>

  <!-- Bot Message 3 (Tool transfer_funds) -->
  <rect x="60" y="500" width="700" height="65" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="80" y="525" fill="#065f46" font-family="sans-serif" font-size="13" font-weight="bold">✅ Virement de 100.00 EUR exécuté avec succès via le tool MCP transfer_funds !</text>
  <text x="80" y="546" fill="#047857" font-family="sans-serif" font-size="12">Nouveau solde émetteur : 4 900.00 EUR • Événement Kafka émis sur bank.transactions.created</text>
  <text x="730" y="555" fill="#94a3b8" font-family="sans-serif" font-size="10">10:47</text>

  <!-- Bottom: Quick Chips & Input Bar -->
  <line x1="40" y1="580" x2="1160" y2="580" stroke="#f1f5f9"/>

  <rect x="60" y="590" width="200" height="26" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="160" y="607" fill="#475569" font-family="sans-serif" font-size="11" text-anchor="middle">💰 Solde compte principal</text>

  <rect x="270" y="590" width="180" height="26" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="607" fill="#475569" font-family="sans-serif" font-size="11" text-anchor="middle">💸 Virement de 100 EUR</text>

  <rect x="460" y="590" width="180" height="26" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="550" y="607" fill="#475569" font-family="sans-serif" font-size="11" text-anchor="middle">➕ Ouvrir un compte</text>

  <!-- Input Field -->
  <rect x="60" y="625" width="940" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="80" y="650" fill="#94a3b8" font-family="sans-serif" font-size="13">Posez une question ou demandez une opération bancaire...</text>
  <rect x="1015" y="625" width="125" height="40" rx="8" fill="#2563eb"/>
  <text x="1077" y="650" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Envoyer 🚀</text>
</svg>
