server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: account-service-rest
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/accounts/**, /mcp/accounts/**
        - id: account-service-graphql
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/graphql/accounts/**
          filters:
            - SetPath=/graphql
        - id: transaction-service-rest
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/transactions/**, /mcp/transactions/**
        - id: transaction-service-graphql
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/graphql/transactions/**
          filters:
            - SetPath=/graphql
        - id: audit-service-rest
          uri: lb://AUDIT-SERVICE
          predicates:
            - Path=/api/audit/**
        - id: chatbot-service-rest
          uri: lb://CHATBOT-SERVICE
          predicates:
            - Path=/api/chat/**, /api/mcp/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

